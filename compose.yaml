# Local stack.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: leaderboard
      POSTGRES_DB: leaderboard
      # Sonar flags a committed password. No auth, so loopback-only.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaderboard -d leaderboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    # Majority writes need a replica set; a single member is enough locally.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first run, then reports whether it is writable.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}) }; db.hello().isWritablePrimary || quit(1)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      secrets: [github_packages_credentials]
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=leaderboard;Username=leaderboard"
      RabbitMq__Enabled: "true"
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: leaderboard
      RabbitMq__Password: leaderboard
      ConnectionStrings__Mongo: "mongodb://mongo:27017/?replicaSet=rs0&directConnection=true"
      RawEventConsumer__Enabled: "true"
      # No provisioning job locally: bind the queue to the producer exchanges directly.
      # On the platform these bindings belong to the broker, see SourceExchanges.
      RawEventConsumer__SourceExchanges__0: player.events
      RawEventConsumer__SourceExchanges__1: dungeon.events
      RawEventConsumer__SourceExchanges__2: combat.events
      RawEventConsumer__SourceExchanges__3: rewards.events
    ports:
      - "8080:8080"
      # Internal gRPC endpoint. Do not expose this port in production Kubernetes ingress.
      - "127.0.0.1:8081:8081"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: leaderboard
      RABBITMQ_DEFAULT_PASS: leaderboard
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  mongo-data:

secrets:
  github_packages_credentials:
    environment: GITHUB_PACKAGES_CREDENTIALS
