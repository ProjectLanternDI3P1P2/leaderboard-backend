name: Sonar

# Separate from the CI pipeline on purpose. The SonarScanner for .NET wraps the build
# (begin → build → test → end), so it cannot reuse the CI jobs; and dev must be analysed
# on push, not only on pull requests, or the reference branch has nothing to compare to.
#
# dev only, never main: the free plan analyses a single long-lived branch, and dev is the
# one worth having (see ADR-0005). Analysing main would need a paid plan.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  packages: read

jobs:
  sonar:
    name: SonarQube Cloud scan
    runs-on: ubuntu-latest
    # Dependabot pull requests are handed Dependabot's own secrets, never the Actions
    # ones, so SONAR_TOKEN would be empty and the scan would fail on every bump. Nothing
    # is lost: a dependency bump changes no C# line, so there is no new code to analyse,
    # and the check that does care about a vulnerable package — Trivy — needs no secret
    # and runs on these pull requests like on any other.
    #
    # Do not make this check required while this condition exists: a required check that
    # never runs blocks every Dependabot pull request permanently.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Sonar reads git blame to decide what counts as new code.
          fetch-depth: 0

      # The scanner is a .NET tool but runs on the JVM.
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Configure GitHub Packages
        env:
          NUGET_USERNAME: ${{ github.actor }}
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.nuget/NuGet"
          touch "$HOME/.nuget/NuGet/NuGet.Config"
          if [ -f "$HOME/.nuget/NuGet/NuGet.Config" ]; then dotnet nuget remove source github --configfile "$HOME/.nuget/NuGet/NuGet.Config" || true; fi
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --name github --configfile "$HOME/.nuget/NuGet/NuGet.Config" --username "$NUGET_USERNAME" --password "$NUGET_AUTH_TOKEN" --store-password-in-clear-text

      # dotnet-sonarscanner and dotnet-coverage are pinned in dotnet-tools.json, so CI
      # and a developer's machine run the same versions.
      - name: Restore .NET tools
        run: dotnet tool restore

      # The SonarScanner for .NET ignores sonar-project.properties entirely — every
      # setting is passed here. Change /k: and /o: when cloning this template.
      - name: Build, test and analyse
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet dotnet-sonarscanner begin \
            /k:"ProjectLanternDI3P1P2_leaderboard-backend" \
            /o:"projectlanterndi3p1p2" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml
          dotnet build Leaderboard.Presentation.slnx --no-incremental
          # Sonar does not read Cobertura for C#; dotnet-coverage's xml format is the
          # vscoveragexml one it expects.
          dotnet dotnet-coverage collect "dotnet test --solution Leaderboard.Presentation.slnx" \
            -f xml -o coverage.xml
          dotnet dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
