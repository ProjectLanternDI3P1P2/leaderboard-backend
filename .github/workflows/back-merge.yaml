name: Back-merge

# release-please writes CHANGELOG.md and the version onto main only, so dev falls behind
# at every release and the next promotion conflicts on exactly those files. Triggering on
# the tag rather than on a push to main is what makes this precise: a tag exists only when
# a release actually happened.

on:
  push:
    tags: ['v*', 'leaderboard-contracts-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  back-merge:
    name: Merge main back into dev
    runs-on: ubuntu-latest
    steps:
      # No checkout: everything here goes through the API, so no credential is ever
      # written to a working copy.
      - name: Open and merge the back-merge pull request
        env:
          # BOT_TOKEN so the pull request triggers CI, same reason as in release-please.
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          ahead=$(gh api "repos/$REPO/compare/dev...main" --jq .ahead_by)
          if [ "$ahead" -eq 0 ]; then
            echo "dev already contains main — nothing to back-merge."
            exit 0
          fi

          number=$(gh pr list -R "$REPO" --base dev --head main --state open \
            --json number --jq '.[0].number // empty')

          if [ -z "$number" ]; then
            gh pr create -R "$REPO" --base dev --head main \
              --title "chore: back-merge $TAG into dev" \
              --body "Restores the changelog and version written on main by release-please."
            number=$(gh pr list -R "$REPO" --base dev --head main --state open \
              --json number --jq '.[0].number')
          fi

          # --merge, never --squash: dev and main must keep a shared history.
          # --auto waits for the required checks instead of forcing past them.
          gh pr merge -R "$REPO" "$number" --merge --auto
