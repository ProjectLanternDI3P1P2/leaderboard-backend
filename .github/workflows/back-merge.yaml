name: Back-merge

# release-please writes CHANGELOG.md and the version onto main only, so dev falls behind
# at every release and the next promotion conflicts on exactly those files. Triggering on
# the tag rather than on a push to main is what makes this precise: a tag exists only when
# a release actually happened.

on:
  push:
    tags: ['v*', 'leaderboard-contracts-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  back-merge:
    name: Merge main back into dev
    runs-on: ubuntu-latest
    steps:
      # No checkout: everything here goes through the API, so no credential is ever
      # written to a working copy.
      - name: Merge main into dev
        env:
          # BOT_TOKEN: its account is the only bypass actor of the dev ruleset, so it can
          # merge without a pull request or approvals. A pull request with --auto never
          # merged on its own: auto-merge does not use the bypass and waits for approvals.
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # 201 = merged, 204 = dev already contains main, 409 = conflict (job fails, resolve by hand).
          # [skip ci]: the merge only brings the changelog and version back, nothing to rebuild.
          gh api "repos/$REPO/merges" -f base=dev -f head=main \
            -f commit_message="chore: back-merge $TAG into dev [skip ci]"
