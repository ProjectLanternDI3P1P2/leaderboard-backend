name: Build

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: dotnet build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Configure GitHub Packages
        run: dotnet nuget update source github --configfile NuGet.config --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      # Release, unlike the test job: a warning that only surfaces in a release build
      # should fail here rather than at packaging time.
      - name: Build solution
        run: dotnet build Leaderboard.Presentation.slnx --configuration Release
