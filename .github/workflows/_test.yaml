name: Test

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: dotnet test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Configure GitHub Packages
        env:
          NUGET_USERNAME: ${{ github.actor }}
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget remove source github --configfile "$HOME/.nuget/NuGet/NuGet.Config" 2>/dev/null || true
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --name github --configfile "$HOME/.nuget/NuGet/NuGet.Config" --username "$NUGET_USERNAME" --password "$NUGET_AUTH_TOKEN" --store-password-in-clear-text

      # Coverage is not collected here — the Sonar workflow collects it while wrapping
      # its own build, and doing it twice would only slow this job down.
      - name: Run tests
        run: dotnet test --solution Leaderboard.Presentation.slnx
