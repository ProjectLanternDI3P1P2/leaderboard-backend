name: Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: dotnet test
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: leaderboard_test
          POSTGRES_USER: leaderboard
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leaderboard -d leaderboard_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      # Mongo needs a replica set for majority writes, and a service container cannot run
      # rs.initiate, so it is started here. Authentication is on so that the role test
      # proves the application account cannot update or delete stored events
      # (US-DATA-01); the admin password is random per run, so nothing is committed.
      - name: Start MongoDB replica set
        run: |
          MONGO_ADMIN_SECRET="$(openssl rand -hex 24)"
          echo "::add-mask::$MONGO_ADMIN_SECRET"
          docker run -d --name mongodb --publish 27017:27017 \
            --env MONGO_INITDB_ROOT_USERNAME=ci --env MONGO_INITDB_ROOT_PASSWORD="$MONGO_ADMIN_SECRET" \
            --entrypoint bash mongo:8.0 -c 'openssl rand -base64 756 > /tmp/keyfile && chmod 400 /tmp/keyfile && chown 999:999 /tmp/keyfile && exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/keyfile --bind_ip_all'
          run_mongosh() { docker exec mongodb mongosh --quiet --username ci --password "$MONGO_ADMIN_SECRET" --eval "$1"; }
          until run_mongosh 'db.hello().ok' > /dev/null 2>&1; do sleep 1; done
          run_mongosh 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          until run_mongosh 'db.hello().isWritablePrimary' | grep -q true; do sleep 1; done
          # Credentials travel apart from the connection string, never inside a URI.
          echo "LEADERBOARD_TEST_MONGO_USER=ci" >> "$GITHUB_ENV"
          echo "LEADERBOARD_TEST_MONGO_SECRET=$MONGO_ADMIN_SECRET" >> "$GITHUB_ENV"

      # Coverage is not collected here — the Sonar workflow collects it while wrapping
      # its own build, and doing it twice would only slow this job down.
      - name: Run tests
        env:
          LEADERBOARD_TEST_DATABASE_CONNECTION: Host=localhost;Port=5432;Database=leaderboard_test;Username=leaderboard
          LEADERBOARD_TEST_RABBITMQ_USER: guest
          LEADERBOARD_TEST_RABBITMQ_PASSWORD: guest
        run: dotnet test --solution Leaderboard.Presentation.slnx

      - name: Verify production migration command against disposable PostgreSQL
        run: bash .github/scripts/test-migration-command.sh
